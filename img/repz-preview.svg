<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2b1a"/>
      <stop offset="100%" stop-color="#2f4a29"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#47753B"/>
      <stop offset="100%" stop-color="#8BC34A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- top bar -->
  <rect x="0" y="0" width="600" height="56" fill="#16220f" opacity="0.6"/>
  <circle cx="30" cy="28" r="10" fill="url(#accent)"/>
  <text x="50" y="33" fill="#eef5e9" font-family="Arial, sans-serif" font-size="18" font-weight="700">REPZ</text>
  <rect x="470" y="16" width="100" height="24" rx="12" fill="url(#accent)"/>
  <text x="484" y="32" fill="#16220f" font-family="Arial, sans-serif" font-size="11" font-weight="700">CHECK-IN</text>

  <!-- welcome -->
  <text x="40" y="100" fill="#eef5e9" font-family="Arial, sans-serif" font-size="22" font-weight="700">Ficha de treino — Aluno</text>
  <text x="40" y="126" fill="#c7d6bd" font-family="Arial, sans-serif" font-size="13">Personal: João · Plano ativo</text>

  <!-- stat cards -->
  <g>
    <rect x="40" y="150" width="160" height="90" rx="14" fill="#233a1e"/>
    <text x="58" y="180" fill="#8BC34A" font-family="Arial, sans-serif" font-size="26" font-weight="700">12</text>
    <text x="58" y="204" fill="#c7d6bd" font-family="Arial, sans-serif" font-size="12">Treinos no mês</text>

    <rect x="220" y="150" width="160" height="90" rx="14" fill="#233a1e"/>
    <text x="238" y="180" fill="#8BC34A" font-family="Arial, sans-serif" font-size="26" font-weight="700">78kg</text>
    <text x="238" y="204" fill="#c7d6bd" font-family="Arial, sans-serif" font-size="12">Última avaliação</text>

    <rect x="400" y="150" width="160" height="90" rx="14" fill="#233a1e"/>
    <text x="418" y="180" fill="#8BC34A" font-family="Arial, sans-serif" font-size="26" font-weight="700">92%</text>
    <text x="418" y="204" fill="#c7d6bd" font-family="Arial, sans-serif" font-size="12">Frequência</text>
  </g>

  <!-- workout list -->
  <g>
    <rect x="40" y="264" width="520" height="34" rx="10" fill="#233a1e"/>
    <circle cx="60" cy="281" r="8" fill="url(#accent)"/>
    <text x="80" y="286" fill="#eef5e9" font-family="Arial, sans-serif" font-size="13">Supino reto — 4x10</text>
    <text x="520" y="286" fill="#8BC34A" font-family="Arial, sans-serif" font-size="12" text-anchor="end">feito</text>

    <rect x="40" y="306" width="520" height="34" rx="10" fill="#233a1e"/>
    <circle cx="60" cy="323" r="8" fill="#4a6a3f"/>
    <text x="80" y="328" fill="#eef5e9" font-family="Arial, sans-serif" font-size="13">Agachamento livre — 4x8</text>
    <text x="520" y="328" fill="#c7d6bd" font-family="Arial, sans-serif" font-size="12" text-anchor="end">pendente</text>

    <rect x="40" y="348" width="520" height="34" rx="10" fill="#233a1e"/>
    <circle cx="60" cy="365" r="8" fill="#4a6a3f"/>
    <text x="80" y="370" fill="#eef5e9" font-family="Arial, sans-serif" font-size="13">Remada curvada — 3x12</text>
    <text x="520" y="370" fill="#c7d6bd" font-family="Arial, sans-serif" font-size="12" text-anchor="end">pendente</text>
  </g>
</svg>
